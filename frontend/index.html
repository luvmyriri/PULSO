<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/pulso-apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#EAF2FF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#080D19" media="(prefers-color-scheme: dark)" />
  <script>
    (function () {
      try {
        var search = new URLSearchParams(window.location.search);
        var isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
                           (window.navigator && window.navigator.standalone === true) ||
                           (localStorage.getItem('pulso_app_mode') === 'standalone') ||
                           search.get('mode') === 'standalone' ||
                           search.get('app') === 'true';
        var isFirstOnboarding = isStandalone && localStorage.getItem('pulso_tutorial_completed') !== 'true';
        var savedMode = localStorage.getItem('pulso_theme_mode');
        var saved = localStorage.getItem('pulso_theme') || localStorage.getItem('theme');
        var isDark;
        if (savedMode === 'dark' || savedMode === 'light') {
          isDark = (savedMode === 'dark');
        } else if (savedMode === 'system') {
          isDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        } else if (isFirstOnboarding) {
          // Older installs may have stored Dark automatically before a resident chose a theme.
          isDark = false;
          localStorage.setItem('pulso_theme_mode', 'light');
          localStorage.setItem('pulso_theme', 'light');
          localStorage.setItem('theme', 'light');
        } else if (saved === 'dark' || saved === 'light') {
          isDark = (saved === 'dark');
        } else {
          // A new installation starts in the light onboarding appearance.
          isDark = false;
          localStorage.setItem('pulso_theme', 'light');
          localStorage.setItem('theme', 'light');
        }
        var root = document.documentElement;
        root.classList.remove('light', 'dark');
        root.classList.add(isDark ? 'dark' : 'light');
        root.setAttribute('data-theme', isDark ? 'dark' : 'light');
        var color = isDark ? '#080D19' : '#EAF2FF';
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
          meta.setAttribute('content', color);
        });

        // Keep the first HTML paint aligned with the React loading screen.
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.href = '/pulso-loading-mark.png';
        document.head.appendChild(link);

        // Check if cold-start of installed mobile app
        if (isStandalone && !sessionStorage.getItem('pulso_session_started')) {
          window.__pulsoInitialSplashActive = true;
        }
      } catch (e) {}
    })();
  </script>
  <style>
    #pulso-initial-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 100dvh;
      background-color: #F7F9FC;
      color: #0B1630;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    html.dark #pulso-initial-splash {
      background-color: #080D19;
      color: #F8FAFC;
    }
    .pulso-splash-main {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      box-sizing: border-box;
      text-align: center;
    }
    .pulso-splash-logo {
      width: clamp(190px, 55vw, 240px);
      height: clamp(190px, 55vw, 240px);
      object-fit: contain;
      margin-bottom: 0.75rem;
    }
    .pulso-splash-wordmark { font-size: clamp(2.5rem, 12vw, 3.5rem); font-weight: 800; line-height: 1; letter-spacing: -0.035em; }
    .pulso-splash-city { margin-top: 0.5rem; font-size: clamp(1rem, 4.3vw, 1.3rem); color: #64748b; }
    .pulso-splash-progress { min-height: 112px; margin-top: 3rem; display: flex; flex-direction: column; align-items: center; gap: 1.25rem; }
    .pulso-splash-spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #e2e8f0;
      border-top-color: #ff6b00;
      border-right-color: #ff6b00;
      border-radius: 50%;
      animation: pulso-splash-spin 0.9s linear infinite;
    }
    .pulso-splash-progress p { margin: 0; font-size: clamp(0.875rem, 3.7vw, 1rem); color: #64748b; }
    .pulso-splash-footer { width: 100%; padding: 0.75rem 1rem max(2rem, env(safe-area-inset-bottom)); box-sizing: border-box; text-align: center; }
    .pulso-splash-rule { display: block; width: 36px; height: 4px; margin: 0 auto 1rem; background: #ff6b00; border-radius: 999px; }
    .pulso-splash-footer strong { display: block; font-size: 0.875rem; font-weight: 600; }
    .pulso-splash-footer small { display: block; margin-top: 0.25rem; font-size: 0.875rem; color: #64748b; }
    html.dark .pulso-splash-city, html.dark .pulso-splash-progress p, html.dark .pulso-splash-footer small { color: #cbd5e1; }
    html.dark .pulso-splash-spinner { border-color: #334155; border-top-color: #ff6b00; border-right-color: #ff6b00; }
    @keyframes pulso-splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .pulso-splash-spinner { animation: none; } }
  </style>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PULSO" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="PULSO - Official Public Utility & Infrastructure Monitoring Portal for Caloocan City. Report road hazards, water leaks, and power outages directly to City Engineering." />
  <title>PULSO | City of Caloocan Public Works &amp; Utility Portal</title>
  <!-- Self-hosted Inter Variable Font (Latin & Latin Ext under 100KB, no CDN) -->
  <link rel="preload" href="/fonts/inter-latin-variable.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
</head>

<body>
  <!-- Instant First-HTML Cold-Start Splash (Removed when React hydrates) -->
  <div id="pulso-initial-splash" role="status" aria-live="polite" aria-label="Loading PULSO">
    <div class="pulso-splash-main">
      <img class="pulso-splash-logo" src="/pulso-loading-mark.png" alt="" aria-hidden="true" />
      <div class="pulso-splash-wordmark">PULSO</div>
      <div id="pulso-splash-city" class="pulso-splash-city">Caloocan City</div>
      <div class="pulso-splash-progress">
        <span class="pulso-splash-spinner" aria-hidden="true"></span>
        <p id="pulso-splash-message">Getting things ready...</p>
      </div>
    </div>
    <div class="pulso-splash-footer">
      <span class="pulso-splash-rule" aria-hidden="true"></span>
      <strong id="pulso-splash-department">City Engineering Department</strong>
      <small id="pulso-splash-government">Caloocan City Government</small>
    </div>
  </div>
  <script>
    if (window.__pulsoInitialSplashActive) {
      var splashEl = document.getElementById('pulso-initial-splash');
      if (splashEl) splashEl.style.display = 'flex';
      try {
        var language = localStorage.getItem('pulso_language') || localStorage.getItem('i18nextLng');
        if (language === 'tl') {
          document.getElementById('pulso-splash-city').textContent = 'Lungsod ng Caloocan';
          document.getElementById('pulso-splash-message').textContent = 'Inihahanda ang PULSO...';
          document.getElementById('pulso-splash-department').textContent = 'City Engineering Department';
          document.getElementById('pulso-splash-government').textContent = 'Pamahalaang Lungsod ng Caloocan';
        }
      } catch (e) {}
    }
  </script>
  <div id="root"></div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
