# Managed by PULSO deployment
server {
    listen 80;
    server_name srv1857115.hstgr.cloud;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/docker/pulso-edge/acme;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name srv1857115.hstgr.cloud;
    ssl_certificate /var/www/html/docker/pulso-edge/certificates/live/srv1857115.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /var/www/html/docker/pulso-edge/certificates/live/srv1857115.hstgr.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;
    resolver 127.0.0.11 valid=30s ipv6=off;
    location / {
        set $pulso_upstream http://pulso-web:80;
        proxy_pass $pulso_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
