<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" fill="none">
  <metadata id="impeccable-direction-contract"><![CDATA[
THESIS: Field evidence becomes accountable public work; refuse generic card dashboards and ornamental cinematic effects.
OWN-WORLD: Civic Aperture morning/night palette, open/ruled surfaces, one Field Aperture per viewport, Signal Cut, Archivo + Source Sans 3 + IBM Plex Mono.
STORY: Residents see evidence, location, status, next event, and a thumb-visible report action; the shared library keeps both portals consistent.
FIRST VIEWPORT: Resident evidence leads, then active record/location, authored lifecycle, report action, and five stable destinations. Foundations/library make light/dark parity and recovery explicit.
FORM: Operate; user-pinned Civic Aperture v0.2; seed key not applicable because the user explicitly approved the generated direction.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
]]></metadata>
  <title>PULSO Civic Aperture v0.2 — Foundations</title>
  <desc>Editable foundations sheet for the PULSO Civic Aperture design system. It documents light and dark semantic colors, typography, scale, elevation, motion, Field Aperture, Signal Cut, contrast, and accessibility rules.</desc>
  <!--
    THESIS: A field observation becomes visible, accountable public work; this sheet refuses the generic SaaS token-card grid.
    OWN-WORLD: Morning field sheet and survey-night surfaces, mineral neutrals, ember resident action, field-blue government action, true-color evidence, ruled records, and the two-pixel Signal Cut.
    STORY: Designers move from semantic foundations to evidence framing and lifecycle accountability, then leave with explicit accessibility constraints.
    FIRST VIEWPORT: A wide civic statement, a surveyed coordinate rail, and an aperture diagram establish the system before token detail.
    FORM: Approved Civic Aperture v0.2 system board translated into an editable field-guide SVG.
    FINISH: Every required foundation is visible, named, theme-paired, and ready for Figma import.
  -->
  <defs>
    <style>
      .display { font-family: "Archivo", "Arial Narrow", sans-serif; font-weight: 700; letter-spacing: -1.2px; }
      .heading { font-family: "Archivo", "Arial Narrow", sans-serif; font-weight: 700; letter-spacing: -0.4px; }
      .body { font-family: "Source Sans 3", "Segoe UI", sans-serif; font-weight: 400; }
      .label { font-family: "Source Sans 3", "Segoe UI", sans-serif; font-weight: 700; letter-spacing: 0.5px; }
      .mono { font-family: "IBM Plex Mono", Consolas, monospace; font-weight: 500; }
      .ink { fill: #0C2436; }
      .muted { fill: #465D6C; }
      .night-ink { fill: #F4F7F2; }
      .night-muted { fill: #B9C7CF; }
      .rule { stroke: #C9D4D9; stroke-width: 1; }
      .night-rule { stroke: #335166; stroke-width: 1; }
      .icon { stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
    <filter id="raised" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0C2436" flood-opacity="0.12"/>
    </filter>
    <filter id="overlay" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#071A2B" flood-opacity="0.22"/>
    </filter>
    <pattern id="survey-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#335166" opacity="0.45"/>
    </pattern>
  </defs>

