  <g id="Typography" transform="translate(32 704)">
    <text x="0" y="0" class="heading ink" font-size="30">Typography carries civic authority</text>
    <text x="0" y="30" class="body muted" font-size="15">Condensed only where it strengthens a public statement; humane everywhere people read or act.</text>
    <line x1="0" y1="54" x2="1376" y2="54" class="rule"/>

    <g id="Type-display-and-heading" transform="translate(0 90)">
      <text x="0" y="0" class="display ink" font-size="62">Evidence is the hero.</text>
      <text x="2" y="34" class="mono muted" font-size="12">DISPLAY / ARCHIVO VARIABLE 700 / 52–64</text>
      <text x="2" y="76" class="heading ink" font-size="30">Move every case forward.</text>
      <text x="2" y="104" class="mono muted" font-size="12">HEADING / ARCHIVO VARIABLE 700 / 28–32</text>
    </g>

    <g id="Type-interface-and-record" transform="translate(704 90)">
      <text x="0" y="0" class="label ink" font-size="16">Interface &amp; long-form / Source Sans 3</text>
      <text x="0" y="34" class="body ink" font-size="18">Report what needs fixing. Track what the city does next.</text>
      <text x="0" y="62" class="body muted" font-size="15">Labels stay plain, states stay explicit, and recovery is always named.</text>
      <text x="0" y="112" class="label ink" font-size="16">Record data / IBM Plex Mono</text>
      <text x="0" y="144" class="mono ink" font-size="15">PUL-2026-0822  /  BRGY 176  /  UPDATED 08:37</text>
      <text x="0" y="172" class="mono muted" font-size="13">14.720712, 120.985134  /  SOURCE: FIELD REPORT</text>
    </g>
  </g>

