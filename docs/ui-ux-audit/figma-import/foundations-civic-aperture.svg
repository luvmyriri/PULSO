        <rect x="102" y="0" width="82" height="66" rx="8" fill="#FFFFFF" stroke="#C9D4D9"/>
        <rect x="204" y="0" width="82" height="66" rx="16" fill="#FFFFFF" filter="url(#raised)"/>
        <text x="0" y="88" class="mono muted" font-size="11">NONE</text><text x="102" y="88" class="mono muted" font-size="11">CONTROL / 8</text><text x="204" y="88" class="mono muted" font-size="11">OVERLAY / 16</text>
      </g>
    </g>
    <g id="Scale-motion" transform="translate(864 46)">
      <text x="0" y="0" class="heading ink" font-size="24">Motion has one job</text>
      <text x="0" y="28" class="body muted" font-size="14">120 pressed · 180 replace · 220 overlay · 320–450 signal</text>
      <path d="M0 77H88L98 70L108 86L119 63L132 77H478" stroke="#B9380B" stroke-width="2"/>
      <circle cx="132" cy="77" r="7" fill="#F4F7F5" stroke="#B9380B" stroke-width="2"/>
      <text x="0" y="112" class="body muted" font-size="13">Reduced: immediate change or short opacity fade. Never loop status.</text>
    </g>
  </g>

  <g id="Signature-principles" transform="translate(32 1260)">
    <rect x="0" y="0" width="840" height="312" rx="12" fill="#0E283E" filter="url(#overlay)"/>
    <rect x="20" y="20" width="800" height="206" rx="8" fill="#071A2B"/>
