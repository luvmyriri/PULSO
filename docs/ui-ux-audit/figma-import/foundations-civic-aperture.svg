        <rect x="0" y="0" width="4" height="18"/><rect x="28" y="0" width="8" height="18"/><rect x="60" y="0" width="12" height="18"/>
        <rect x="96" y="0" width="16" height="18"/><rect x="136" y="0" width="24" height="18"/><rect x="184" y="0" width="32" height="18"/>
        <rect x="240" y="0" width="48" height="18"/><rect x="312" y="0" width="64" height="18"/>
      </g>
    </g>
    <g id="Scale-radius-and-elevation" transform="translate(448 46)">
      <text x="0" y="0" class="heading ink" font-size="24">Radius &amp; elevation</text>
      <g id="Scale-radius-samples" transform="translate(0 44)">
