    <text x="116" y="42" class="label" font-size="14" fill="#B9380B">PULSO CORE  /  CIVIC APERTURE  /  v0.2</text>
    <text x="116" y="112" class="display ink" font-size="54">Field evidence becomes</text>
    <text x="32" y="169" class="display ink" font-size="54">accountable public work.</text>
    <text x="34" y="204" class="body muted" font-size="17">One civic record. Two purpose-built views. No decorative certainty.</text>

