    <text x="40" y="278" class="mono night-muted" font-size="12">BRGY 167 · 10TH AVE  /  14.720712, 120.985134  /  UPDATED 08:37</text>
    <text x="684" y="258" class="label" font-size="13" fill="#FF8A3D">IN PROGRESS</text>

    <g id="Signature-usage-principles" transform="translate(900 8)">
      <text x="0" y="0" class="heading ink" font-size="30">Field Aperture</text>
      <text x="0" y="32" class="body muted" font-size="15">One evidence or map region anchors the task.</text>
      <text x="0" y="62" class="body ink" font-size="15">• Four quiet corners frame the source.</text>
      <text x="0" y="88" class="body ink" font-size="15">• Evidence stays true-color and unfiltered.</text>
      <text x="0" y="114" class="body ink" font-size="15">• Metadata sits on an opaque rail.</text>
      <text x="0" y="140" class="body ink" font-size="15">• Maps always have a list/address alternative.</text>
      <text x="0" y="198" class="heading ink" font-size="30">Signal Cut</text>
      <text x="0" y="230" class="body muted" font-size="15">A two-pixel route connects evidence to public record.</text>
      <text x="0" y="260" class="body ink" font-size="15">Current state uses one notch, icon, label, and time.</text>
      <text x="0" y="286" class="body ink" font-size="15">No straight-dot stepper. No color-only meaning.</text>
    </g>
  </g>

